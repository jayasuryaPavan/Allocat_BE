# Development configuration for shared Cloud SQL database (Public IP)
# Team members can use this profile to connect to the shared database
server.port=${PORT:8081}
spring.application.name=allocat-api

# Cloud SQL via Public IP
# Instance: allocat-481117:us-central1:allocat-db
spring.datasource.url=jdbc:postgresql://34.66.13.124:5432/allocat_db
spring.datasource.username=${CLOUDSQL_DB_USER:allocat_user}
spring.datasource.password=${CLOUDSQL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (sized for development)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=false

# Logging (verbose for development)
logging.level.com.allocat=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
